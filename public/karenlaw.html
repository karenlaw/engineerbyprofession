<style>
/* Layout: one narrow card column, the printed card's look carried onto a phone screen */
:root {
  --bg: #f4f1ec;
  --card: #ffffff;
  --ink: #1f2a36;
  --muted: #55606c;
  --rule: #d9d4cc;
  --accent: #8a3b2a;
  --chip: #ffffff;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171e; --card: #1a222c; --ink: #ece7df; --muted: #a3acb6;
    --rule: #2f3a46; --accent: #e09a85; --chip: #f4f1ec; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171e; --card: #1a222c; --ink: #ece7df; --muted: #a3acb6;
  --rule: #2f3a46; --accent: #e09a85; --chip: #f4f1ec; color-scheme: dark;
}
html { color-scheme: light dark; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 40px;
}
.card {
  max-width: 420px; margin: 0 auto; background: var(--card);
  border: 1px solid var(--rule); border-radius: 6px;
  padding: 28px 24px; display: flex; flex-direction: column; gap: 24px;
}
header { display: flex; align-items: center; gap: 16px; }
.mono {
  width: 76px; height: 76px; flex: none; border-radius: 50%; background: var(--chip);
  border: 1px solid var(--rule); display: grid; place-items: center;
}
.mono img { width: 54px; height: 50px; object-fit: contain; }
h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 38px; line-height: 1; text-wrap: balance; }
.role { margin: 6px 0 0; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.tag { margin: 4px 0 0; font-family: var(--display); font-style: italic; font-weight: 500; font-size: 17px; color: var(--muted); }

.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.rows li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.rows svg { flex: none; color: var(--muted); }
.val { flex: 1; min-width: 0; font-size: 13.5px; overflow-wrap: anywhere; }
.val a { color: inherit; text-decoration: none; }
.val a:hover { text-decoration: underline; text-underline-offset: 3px; }
.copy {
  flex: none; font: 500 11px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--accent); background: transparent; border: 1px solid var(--rule); border-radius: 4px;
  padding: 8px 10px; min-height: 32px; cursor: pointer;
}
.copy:hover { border-color: var(--accent); }

.links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
  border-radius: 4px; font: 500 13px/1 var(--mono); text-decoration: none;
  border: 1px solid var(--ink); color: var(--ink);
}
.btn.primary { background: var(--ink); color: var(--card); }
.btn:hover { opacity: 0.88; }

.qr { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.seg { display: flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg button {
  font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
  padding: 10px 14px; min-height: 40px; border: 0; background: transparent; color: var(--muted); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.qrbox { width: 240px; max-width: 100%; aspect-ratio: 1; background: #ffffff; border-radius: 4px; padding: 8px; box-sizing: border-box; }
.qrbox svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
.hint { margin: 0; font-size: 12px; color: var(--muted); text-align: center; max-width: 30ch; }
footer { text-align: center; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }

button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
